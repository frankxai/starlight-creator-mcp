name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    # Keep the required context present for docs; filter paths inside the workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node --test scripts/test/ci-enforcement.test.mjs
      - id: scope
        run: node scripts/ci-scope.mjs
  typecheck-unit:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the clean project dependency graph
        run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm lint
      - run: npx vitest run packages/packs-spec packages/core
      - run: pnpm run test:release
  storage-runtime:
    # Real S3 SDK transport through guardedFetch (>2 MB SigV4 upload) on every advertised Node major.
    needs: [scope, typecheck-unit]
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx vitest run packages/storage-s3 packages/core/src/net packages/core/src/error-bodies.test.ts
  e2e:
    if: needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [scope, typecheck-unit]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx vitest run packages/server/test
      - run: node packages/cli/dist/main.js packs
        env:
          CREATOR_MCP_HOME: ${{ runner.temp }}/creator-home
          CREATOR_VAULT_BACKEND: encrypted-file
  release-artifacts:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.5.0
      - name: Install digest-pinned secret scanner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          if [ "$RUNNER_OS" = Windows ]; then
            archive=gitleaks_8.30.1_windows_x64.zip
          else
            archive=gitleaks_8.30.1_linux_x64.tar.gz
          fi
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern "$archive" --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          grep " $archive$" gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e  gitleaks_8.30.1_windows_x64.zip' | sha256sum --check --strict
            unzip "$archive" gitleaks.exe
          else
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          fi
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test:release
      - run: pnpm test -- --maxWorkers=1
      - run: pnpm audit --audit-level=moderate
      - run: pnpm run verify:release
      - run: pnpm run test:consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-npm-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/npm-release/
          if-no-files-found: error
          retention-days: 7
  published-bytes-windows:
    # Exercise Windows against the exact Linux-built archives intended for publishing.
    needs: [scope, release-artifacts]
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: creator-npm-ubuntu-latest-${{ github.sha }}
          path: artifacts/npm-release/
      - run: node scripts/test-consumer.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-published-bytes-windows-${{ github.sha }}
          path: artifacts/npm-release/consumer.json
          if-no-files-found: error
          retention-days: 7
  acceptance:
    if: always()
    needs: [scope, typecheck-unit, storage-runtime, e2e, release-artifacts, published-bytes-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node scripts/ci-acceptance.mjs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
